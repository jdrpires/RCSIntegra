  /api/client/messages:
    get:
      description: "Consultar mensagens enviadas pelo cliente\n\nEste endpoint permite\
        \ que clientes consultem suas mensagens enviadas\ncom filtros opcionais por\
        \ data, status, número de telefone, etc.\n\n**Parâmetros de consulta:**\n\
        - **client_code**: Código do cliente\n- **start_date**: Data inicial (formato:\
        \ YYYY-MM-DD)\n- **end_date**: Data final (formato: YYYY-MM-DD)\n- **status**:\
        \ Status da mensagem (pending, sent, delivered, read, failed)\n- **phone_number**:\
        \ Número de telefone específico\n- **limit**: Limite de resultados (padrão:\
        \ 100)\n- **offset**: Offset para paginação (padrão: 0)\n\n**Exemplo de resposta:**\n\
        ```json\n[\n    {\n        \"id\": \"123\",\n        \"client_message_id\"\
        : \"CLI_ABC123_a1b2c3d4\",\n        \"phone_number\": \"5511999999999\",\n\
        \        \"status\": \"delivered\",\n        \"message_type\": \"basic\",\n\
        \        \"campaign_name\": \"Promocao_Janeiro\",\n        \"sent_at\": \"\
        2025-01-15T10:30:00Z\",\n        \"delivered_at\": \"2025-01-15T10:31:00Z\"\
        ,\n        \"created_at\": \"2025-01-15T10:30:00Z\"\n    }\n]\n```"
      operationId: get_messages_api_client_messages_get
      parameters:
      - in: query
        name: client_code
        required: true
        schema:
          title: Client Code
          type: string
      - in: query
        name: start_date
        required: false
        schema:
          title: Start Date
          type: string
      - in: query
        name: end_date
        required: false
        schema:
          title: End Date
          type: string
      - in: query
        name: status
        required: false
        schema:
          title: Status
          type: string
      - in: query
        name: phone_number
        required: false
        schema:
          title: Phone Number
          type: string
      - in: query
        name: limit
        required: false
        schema:
          default: 100
          title: Limit
          type: integer
      - in: query
        name: offset
        required: false
        schema:
          default: 0
          title: Offset
          type: integer
      - description: API Key do cliente
        in: header
        name: x-api-key
        required: true
        schema:
          description: API Key do cliente
          title: X-Api-Key
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ClientMessageResponse'
                title: Response Get Messages Api Client Messages Get
                type: array
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Messages
      tags:
      - Serviços para Clientes
  /api/client/messages/{client_message_id}:
    get:
      description: 'Consultar mensagem específica pelo ID do cliente


        **Parâmetros:**

        - **client_message_id**: ID único da mensagem gerado para o cliente'
      operationId: get_message_by_id_api_client_messages__client_message_id__get
