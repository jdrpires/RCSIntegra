  /api/client/send-message:
    post:
      description: "Endpoint principal para clientes enviarem mensagens RCS\n\nEste\
        \ endpoint permite que clientes autenticados enviem mensagens RCS\nespecificando\
        \ o tipo (basic ou single) e opcionalmente um template.\n\n**Parâmetros:**\n\
        - **client_code**: Código do cliente (deve corresponder ao cliente autenticado)\n\
        - **user_code**: Código do usuário (opcional)\n- **message_type**: Tipo da\
        \ mensagem (\"basic\" ou \"single\")\n- **template_id**: ID do template da\
        \ plataforma (opcional)\n- **phone_numbers**: Lista de números de telefone\n\
        - **variables**: Variáveis para substituição no template\n- **content**: Conteúdo\
        \ personalizado (se não usar template)\n- **callback_url**: URL de callback\
        \ (opcional, usa padrão do cliente)\n- **campaign_name**: Nome da campanha\
        \ (opcional)\n\n**Exemplo de uso:**\n```json\n{\n    \"client_code\": \"CLI_ABC123\"\
        ,\n    \"user_code\": \"user001\",\n    \"message_type\": \"basic\",\n   \
        \ \"template_id\": \"template_001\",\n    \"phone_numbers\": [\"5511999999999\"\
        ],\n    \"variables\": {\n        \"nome\": \"João\",\n        \"produto\"\
        : \"Smartphone\"\n    },\n    \"callback_url\": \"https://meusite.com/callback\"\
        ,\n    \"campaign_name\": \"Promocao_Janeiro\"\n}\n```"
      operationId: send_message_api_client_send_message_post
      parameters:
      - description: API Key do cliente
        in: header
        name: x-api-key
        required: true
        schema:
          description: API Key do cliente
          title: X-Api-Key
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientSendMessageRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientSendMessageResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Send Message
      tags:
      - Serviços para Clientes
