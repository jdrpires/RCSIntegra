info:
  contact:
    email: suporte@exemplo.com
    name: Suporte RCS Gateway
  description: "\n    Gateway em Python para integração com a API RCS da Eugen\
    \ com sistema completo de autenticação JWT e multi-tenancy.\n    \n    ## Funcionalidades\n\
    \    \n    ### Para Administradores:\n    - ✅ **Gerenciamento de Clientes**: Criar\
    \ e gerenciar clientes da API\n    - ✅ **Gerenciamento de Usuários**: Criar usuários\
    \ para cada cliente\n    - ✅ **API Keys**: Gerar chaves de API para autenticação\n\
    \    - ✅ **Templates**: Gerenciar templates por cliente\n    \n    ### Para Clientes:\n\
    \    - ✅ **Envio de Mensagens**: Endpoint unificado para envio via API Key\n \
    \   - ✅ **Consulta de Mensagens**: Visualizar apenas suas próprias mensagens\n\
    \    - ✅ **Estatísticas**: Relatórios de uso e performance\n    - ✅ **Multi-tenancy**:\
    \ Isolamento completo entre clientes\n    \n    ### Tipos de Mensagem Suportados:\n\
    \    - **Basic**: Mensagens simples com fallback SMS\n    - **Single**: Mensagens\
    \ com Rich Cards, Carousel, etc.\n    \n    ## Autenticação\n    \n    ### Para\
    \ Administradores:\n    - Login via JWT Token\n    - Acesso completo ao sistema\n\
    \    \n    ### Para Clientes:\n    - Autenticação via API Key no header `X-API-Key`\n\
    \    - Acesso restrito às próprias mensagens e recursos\n    \n    ## Como Usar\n\
    \    \n    ### 1. Para Clientes (Uso Principal):\n    \n    ```bash\n    # Enviar\
    \ mensagem básica\n    curl -X POST \"http://localhost:8000/api/client/send-message\"\
    \ \\\n         -H \"X-API-Key: sua_api_key_aqui\" \\\n         -H \"Content-Type:\
    \ application/json\" \\\n         -d '{\n           \"client_code\": \"CLI_ABC123\"\
    ,\n           \"message_type\": \"basic\",\n           \"phone_numbers\": [\"\
    5511999999999\"],\n           \"content\": {\n             \"text\": {\n     \
    \          \"message\": \"Olá! Esta é uma mensagem de teste.\"\n             }\n\
    \           }\n         }'\n    \n    # Consultar mensagens\n    curl -X GET \"\
    http://localhost:8000/api/client/messages?client_code=CLI_ABC123\" \\\n      \
    \   -H \"X-API-Key: sua_api_key_aqui\"\n    ```\n    \n    ### 2. Para Administradores:\n\
    \    \n    ```bash\n    # Login\n    curl -X POST \"http://localhost:8000/api/auth/login\"\
    \ \\\n         -H \"Content-Type: application/json\" \\\n         -d '{\n    \
    \       \"username\": \"admin\",\n           \"password\": \"admin123\"\n    \
    \     }'\n    \n    # Criar cliente\n    curl -X POST \"http://localhost:8000/api/admin/clients\"\
    \ \\\n         -H \"Authorization: Bearer seu_jwt_token\" \\\n         -H \"Content-Type:\
    \ application/json\" \\\n         -d '{\n           \"name\": \"Novo Cliente\"\
    ,\n           \"email\": \"cliente@exemplo.com\",\n           \"rcs_account\"\
    : \"15886\"\n         }'\n    ```\n    "
  title: RCS Gateway API with Authentication
  version: 2.0.0
openapi: 3.1.0
paths:
  /:
    get:
      description: Informações da API
      operationId: root__get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Root
      tags:
      - Sistema
  /api/admin/api-keys:
    get:
      description: Listar API Keys
      operationId: list_api_keys_api_admin_api_keys_get
      parameters:
      - in: query
        name: client_id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Client Id
      - in: query
        name: skip
        required: false
        schema:
          default: 0
          title: Skip
          type: integer
      - in: query
        name: limit
        required: false
        schema:
          default: 100
          title: Limit
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/APIKey'
                title: Response List Api Keys Api Admin Api Keys Get
                type: array
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List Api Keys
      tags:
      - Autenticação e Administração
    post:
      description: Criar nova API Key
      operationId: create_api_key_api_admin_api_keys_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/APIKeyCreate'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKey'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Create Api Key
      tags:
      - Autenticação e Administração
  /api/admin/api-keys/{api_key_id}:
    delete:
      description: Desativar API Key
      operationId: delete_api_key_api_admin_api_keys__api_key_id__delete
      parameters:
      - in: path
        name: api_key_id
        required: true
        schema:
          title: Api Key Id
